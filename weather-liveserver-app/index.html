<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>날씨 API 비동기 실습 (Live Server 전용)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hero-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
    }
    .badge-provider {
      background-color: #10b981;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 9999px;
    }
    .buzzer-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      background: white;
      transition: all 0.3s ease;
    }
    .buzzer-box.pending {
      border-color: #f59e0b;
      background-color: #fffbeb;
    }
    .buzzer-box.fulfilled {
      border-color: #10b981;
      background-color: #ecfdf5;
    }
    .buzzer-box.rejected {
      border-color: #ef4444;
      background-color: #fef2f2;
    }
    .terminal-window {
      background: #090d16;
      border-radius: 10px;
      padding: 16px;
      color: #38bdf8;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      height: 230px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="py-5">
  <div class="container" style="max-width: 850px;">
    
    <!-- 상단 소개 카드 -->
    <div class="hero-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="fw-bold mb-0">☕ 카페 진동벨로 배우는 비동기 날씨 앱</h2>
        <span class="badge badge-provider">Live Server </span>
      </div>
      <p class="text-slate-300 text-secondary mb-0">
        Node.js 없이 브라우저에서 직접 Open-Meteo 공개 API를 호출합니다 (CORS 걱정 없음).
      </p>
    </div>

    <!-- 제어 패널 -->
    <div class="card shadow-sm border-0 mb-4 p-4">
      <h5 class="fw-bold mb-3">1. 날씨 요청 제어판</h5>
      <div class="row g-3 align-items-center">
        <div class="col-md-5">
          <label class="form-label small text-muted">도시 선택</label>
          <select id="citySelect" class="form-select">
            <option value="seoul">서울 (Seoul)</option>
            <option value="tokyo">도쿄 (Tokyo)</option>
            <option value="newyork">뉴욕 (New York)</option>
            <option value="london">런던 (London)</option>
            <option value="paris">파리 (Paris)</option>
          </select>
        </div>
        <div class="col-md-7 d-flex gap-2 align-items-end pt-4">
          <button id="btnFetchSingle" class="btn btn-primary flex-fill py-2 fw-semibold">
            단일 조회 (async / await)
          </button>
          <button id="btnFetchAll" class="btn btn-success flex-fill py-2 fw-semibold">
            5개 도시 병렬 조회 (Promise.all)
          </button>
        </div>
      </div>
    </div>

    <!-- 진동벨 상태 카드 -->
    <div id="buzzerCard" class="buzzer-box mb-4">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h6 class="fw-bold mb-0" id="buzzerTitle">🔔 진동벨 (Promise) 상태: 대기 준비 완료</h6>
        <span class="badge bg-secondary" id="buzzerBadge">IDLE</span>
      </div>
      <p class="mb-0 text-muted small" id="buzzerDesc">버튼을 클릭하면 진동벨(Promise)을 받고 날씨 조회를 시작합니다.</p>
      
      <!-- 날씨 수령 결과 영역 -->
      <div id="weatherResult" class="mt-3 pt-3 border-top d-none">
        <div class="row text-center" id="resultGrid"></div>
      </div>
    </div>

    <!-- 터미널 콘솔 로그 창 -->
    <div class="card shadow-sm border-0 p-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold mb-0">📜 비동기 처리 실시간 콘솔 (Console Log)</h6>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">로그 지우기</button>
      </div>
      <div class="terminal-window" id="terminalLog">> 시스템 준비 완료. 상단 버튼을 클릭해보세요.</div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
