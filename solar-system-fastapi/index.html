<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>

    <style>
        #language-selector {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.75;
        }

        .lang-btn:hover {
            opacity: 1;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050816;
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #planet-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .planet-card {
            background: #11182c;
            border-radius: 16px;
            padding: 20px;
            text-align: center;

            cursor: pointer;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .planet-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .planet-card:hover {
            transform: scale(1.03);
        }

        .planet-card h2 {
            margin-top: 0;
        }

        .planet-card p {
            margin: 8px 0;
            color: #d7dbea;
        }

        .planet-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        @media (max-width: 900px) {
            #planet-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            #planet-container {
                grid-template-columns: 1fr;
            }
        }

        #planet-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal-content {
            position: relative;
            width: 520px;
            max-width: 90%;
            background: #11182c;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #modal-image {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        #modal-name {
            font-size: 30px;
            margin: 10px 0 18px;
        }

        #modal-info p {
            margin: 10px 0;
            color: #d7dbea;
        }

        #modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            border: none;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        #compare-section {
            max-width: 900px;
            margin: 0 auto 30px;
            padding: 20px;
            text-align: center;
        }

        .compare-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .compare-controls select,
        #compare-button {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        #compare-button {
            cursor: pointer;
            font-weight: bold;
        }

        #compare-result {
            margin-top: 25px;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            max-width: 850px;
            margin: 0 auto;
            background: #11182c;
            border-radius: 16px;
            overflow: hidden;
        }

        .compare-grid>div {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .compare-header {
            font-size: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.04);
        }

        .compare-label {
            font-weight: bold;
            color: #d7dbea;
        }
    </style>
</head>

<body>

    <header>
        <h1>SOLAR SYSTEM EXPLORER</h1>
        <p>태양계 8개 행성을 탐험해보세요.</p>

        <div id="language-selector">
            <button class="lang-btn" data-lang="ko">🇰🇷 한국어</button>
            <button class="lang-btn" data-lang="en">🇺🇸 English</button>
            <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
        </div>
        </div>
    </header>

    <section id="compare-section">

        <h2>Compare Planets</h2>

        <div class="compare-controls">

            <select id="planet-a">
                <option value="mercury">Mercury</option>
                <option value="venus">Venus</option>
                <option value="earth" selected>Earth</option>
                <option value="mars">Mars</option>
                <option value="jupiter">Jupiter</option>
                <option value="saturn">Saturn</option>
                <option value="uranus">Uranus</option>
                <option value="neptune">Neptune</option>
            </select>

            <span>VS</span>

            <select id="planet-b">
                <option value="mercury">Mercury</option>
                <option value="venus">Venus</option>
                <option value="earth">Earth</option>
                <option value="mars" selected>Mars</option>
                <option value="jupiter">Jupiter</option>
                <option value="saturn">Saturn</option>
                <option value="uranus">Uranus</option>
                <option value="neptune">Neptune</option>
            </select>

            <button id="compare-button">
                COMPARE
            </button>

        </div>

        <div id="compare-result"></div>

    </section>

    <main id="planet-container">
    </main>

    <div id="planet-modal">

        <div id="modal-content">

            <button id="modal-close">✕</button>

            <img id="modal-image" src="" alt="Planet">

            <h2 id="modal-name"></h2>

            <div id="modal-info">
            </div>

        </div>

    </div>

    <script>

        const translations = {
            ko: {
                subtitle: "태양계 8개 행성을 탐험해보세요.",
                compareTitle: "행성 비교",
                compareButton: "비교하기",

                gravity: "중력",
                radius: "반지름",
                temperature: "온도",
                orbit: "공전주기",
                rotation: "자전주기",
                moons: "위성",

                years: "년",
                year: "년",
                hours: "시간",

                prograde: "순행 자전",
                retrograde: "역행 자전"
            },

            en: {
                subtitle: "Explore the 8 planets of the Solar System.",
                compareTitle: "Compare Planets",
                compareButton: "COMPARE",

                gravity: "Gravity",
                radius: "Radius",
                temperature: "Temperature",
                orbit: "Orbit",
                rotation: "Rotation",
                moons: "Moons",

                years: "years",
                year: "year",
                hours: "hours",

                prograde: "Prograde",
                retrograde: "Retrograde"
            },

            es: {
                subtitle: "Explora los 8 planetas del Sistema Solar.",
                compareTitle: "Comparar planetas",
                compareButton: "COMPARAR",

                gravity: "Gravedad",
                radius: "Radio",
                temperature: "Temperatura",
                orbit: "Órbita",
                rotation: "Rotación",
                moons: "Lunas",

                years: "años",
                year: "año",
                hours: "horas",

                prograde: "Rotación prograda",
                retrograde: "Rotación retrógrada"
            }
        };

        let currentLanguage = "ko";

        function updateLanguage() {
            const t = translations[currentLanguage];

            document.querySelector("header p").textContent = t.subtitle;
            document.querySelector("#compare-section h2").textContent = t.compareTitle;
            document.getElementById("compare-button").textContent = t.compareButton;
        }

        document.querySelectorAll(".lang-btn").forEach(button => {
            button.addEventListener("click", () => {
                currentLanguage = button.dataset.lang;
                updateLanguage();

                document.getElementById("planet-container").innerHTML = "";
                loadPlanets();
            });
        });

        async function loadPlanets() {

            const response = await fetch("/planets");
            const planets = await response.json();

            const container =
                document.getElementById("planet-container");

            for (const planet of planets) {
                const t = translations[currentLanguage];

                const orbitText =
                    planet.orbital_period_years === 1
                        ? `1 ${t.year}`
                        : `${planet.orbital_period_years} ${t.years}`;

                const imageResponse = await fetch(
                    `/planet-image/${planet.name.toLowerCase()}`
                );

                const imageData = await imageResponse.json();

                const card = document.createElement("div");
                card.className = "planet-card";

                card.innerHTML = `
    <img
        class="planet-image"
        src="${imageData.image_url}"
        alt="${planet.name}"
    >

    <h2>${planet.name}</h2>

    <p>${t.gravity}: ${planet.gravity} m/s²</p>
    <p>${t.radius}: ${planet.mean_radius_km} km</p>
    <p>${t.temperature}: ${planet.average_temperature_c} °C</p>
    <p>${t.orbit}: ${orbitText}</p>
    <p>${t.moons}: ${planet.moons}</p>
`;

                card.addEventListener("click", async () => {

                    const response = await fetch(
                        `/planet-full/${planet.name.toLowerCase()}`,
                        { cache: "no-store" }
                    );

                    const detail = await response.json();

                    if (!response.ok) {
                        alert(`${planet.name} 상세 정보를 불러오지 못했습니다.`);
                        return;
                    }

                    document.getElementById("modal-name").textContent = detail.name;
                    document.getElementById("modal-image").src = detail.image_url;

                    const directionText =
                        detail.rotation_direction === "Retrograde"
                            ? t.retrograde
                            : t.prograde;

                    const detailOrbitText =
                        detail.orbital_period_years === 1
                            ? `1 ${t.year}`
                            : `${detail.orbital_period_years} ${t.years}`;

                    document.getElementById("modal-info").innerHTML = `
    <p>${t.gravity}: ${detail.gravity} m/s²</p>
    <p>${t.radius}: ${detail.mean_radius_km} km</p>
    <p>${t.temperature}: ${detail.average_temperature_c} °C</p>
    <p>${t.orbit}: ${detailOrbitText}</p>
    <p>
        ${t.rotation}: ${detail.rotation_hours} ${t.hours}
        (${directionText})
    </p>
    <p>${t.moons}: ${detail.moons}</p>
`;

                    document.getElementById("planet-modal").style.display = "flex";
                });

                container.appendChild(card);
            }
        }

        document.getElementById("modal-close").addEventListener("click", () => {
            document.getElementById("planet-modal").style.display = "none";
        });

        document.getElementById("planet-modal").addEventListener("click", (event) => {
            if (event.target.id === "planet-modal") {
                document.getElementById("planet-modal").style.display = "none";
            }
        });

        document.getElementById("compare-button").addEventListener("click", async () => {

            const t = translations[currentLanguage];

            const planetA = document.getElementById("planet-a").value;
            const planetB = document.getElementById("planet-b").value;

            const responseA = await fetch(
                `/planet-full/${planetA}`,
                { cache: "no-store" }
            );

            const responseB = await fetch(
                `/planet-full/${planetB}`,
                { cache: "no-store" }
            );

            const dataA = await responseA.json();
            const dataB = await responseB.json();

            const result = document.getElementById("compare-result");

            result.innerHTML = `
    <div class="compare-grid">

        <div class="compare-header"></div>
        <div class="compare-header">${dataA.name}</div>
        <div class="compare-header">${dataB.name}</div>

        <div class="compare-label">${t.gravity}</div>
        <div>${dataA.gravity} m/s²</div>
        <div>${dataB.gravity} m/s²</div>

        <div class="compare-label">${t.radius}</div>
        <div>${dataA.mean_radius_km} km</div>
        <div>${dataB.mean_radius_km} km</div>

        <div class="compare-label">${t.temperature}</div>
        <div>${dataA.average_temperature_c} °C</div>
        <div>${dataB.average_temperature_c} °C</div>

        <div class="compare-label">${t.orbit}</div>

<div>
    ${dataA.orbital_period_years === 1
                    ? `1 ${t.year}`
                    : `${dataA.orbital_period_years} ${t.years}`}
</div>

<div>
    ${dataB.orbital_period_years === 1
                    ? `1 ${t.year}`
                    : `${dataB.orbital_period_years} ${t.years}`}
</div>
        <div class="compare-label">${t.moons}</div>
        <div>${dataA.moons}</div>
        <div>${dataB.moons}</div>

    </div>
`;
        });

        updateLanguage();
        loadPlanets();


    </script>

</body>

</html>
