<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050816;
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #planet-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .planet-card {
            background: #11182c;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .planet-card:hover {
            transform: scale(1.03);
        }

        .planet-card h2 {
            margin-top: 0;
        }

        .planet-card p {
            margin: 8px 0;
            color: #d7dbea;
        }

        .planet-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        @media (max-width: 900px) {
            #planet-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            #planet-container {
                grid-template-columns: 1fr;
            }
        }

        #planet-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal-content {
            position: relative;
            width: 500px;
            max-width: 90%;
            background: #11182c;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        #modal-image {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 14px;
        }

        #modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            border: none;
            background: transparent;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>SOLAR SYSTEM EXPLORER</h1>
        <p>태양계 8개 행성을 탐험해보세요.</p>
    </header>

    <main id="planet-container">
    </main>

    <div id="planet-modal">

        <div id="modal-content">

            <button id="modal-close">✕</button>

            <img id="modal-image" src="" alt="Planet">

            <h2 id="modal-name"></h2>

            <div id="modal-info">
            </div>

        </div>

    </div>

    <script>
        async function loadPlanets() {

            const response = await fetch("/planets");
            const planets = await response.json();

            const container =
                document.getElementById("planet-container");

            for (const planet of planets) {

                const imageResponse = await fetch(
                    `/planet-image/${planet.name.toLowerCase()}`
                );

                const imageData = await imageResponse.json();

                const card = document.createElement("div");
                card.className = "planet-card";

                card.innerHTML = `
                <img
                    class="planet-image"
                    src="${imageData.image_url}"
                    alt="${planet.name}"
                >

                <h2>${planet.name}</h2>

                <p>Gravity: ${planet.gravity} m/s²</p>
                <p>Radius: ${planet.mean_radius_km} km</p>
                <p>Temperature: ${planet.average_temperature_c} °C</p>
                <p>Orbit: ${planet.orbital_period_days} days</p>
                <p>Moons: ${planet.moons}</p>
            `;

                card.addEventListener("click", async () => {

                    const response = await fetch(
                        `/planet-full/${planet.name.toLowerCase()}`,
                        { cache: "no-store" }
                    );

                    const detail = await response.json();

                    if (!response.ok) {
                        alert(`${planet.name} 상세 정보를 불러오지 못했습니다.`);
                        return;
                    }

                    document.getElementById("modal-name").textContent = detail.name;

                    document.getElementById("modal-image").src = detail.image_url;

                    document.getElementById("modal-info").innerHTML = `
    <p>Gravity: ${detail.gravity} m/s²</p>
    <p>Radius: ${detail.mean_radius_km} km</p>
    <p>Temperature: ${detail.average_temperature_c} °C</p>
    <p>Orbit: ${detail.orbital_period_years} years</p>
     Rotation: ${detail.rotation_hours} hours
    (${detail.rotation_direction})
    <p>Moons: ${detail.moons}</p>
`;

                    document.getElementById("planet-modal").style.display = "flex";
                });

                container.appendChild(card);
            }
        }

        document.getElementById("modal-close").addEventListener("click", () => {
            document.getElementById("planet-modal").style.display = "none";
        });

        loadPlanets();
    </script>

</body>

</html>
